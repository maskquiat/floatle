<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floatle — Keep what matters in view</title>
<meta name="description" content="Floatle: floating sticky notes that keep what matters in view. Write it. Float it. See it. Made by a teacher.">
<meta name="theme-color" content="#173A55">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Nunito:wght@900&display=swap">
<style id="app-css">
:root{
  --chrome:#FFFFFF; --chrome-2:#F3F5F7; --ink:#1B2530; --muted:#5B6874; --line:#D8DDE2;
  --accent:#C63F77; --accent-ink:#FFFFFF; --danger:#B42318;
  --ink-note:#1D1A14;
  --koi-pink:#FA82B1; --lily-green:#92CC84; --pond-blue:#4AC4EC;
  --brand-font:"Nunito", var(--font);
  --font:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#141A21; --chrome-2:#1C242D; --ink:#E6EBF0; --muted:#98A5B2; --line:#2B3642;
    --accent:#FF8DB8; --accent-ink:#2A0E1A; --danger:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  --chrome:#141A21; --chrome-2:#1C242D; --ink:#E6EBF0; --muted:#98A5B2; --line:#2B3642;
  --accent:#FF8DB8; --accent-ink:#2A0E1A; --danger:#FF8A7A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--font);color:var(--ink);background:var(--chrome);display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:50;flex:0 0 auto}
.tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;padding:.45rem .8rem;border-radius:.5rem;white-space:nowrap;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--chrome-2);color:var(--ink);border-color:var(--line)}
.tab.add{font-weight:400}
.date{color:var(--muted);white-space:nowrap;font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--chrome);padding:.45rem .75rem;border-radius:.5rem;white-space:nowrap}
.btn:hover{background:var(--chrome-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
.present-title{display:none;font-weight:700;font-size:1.35rem}
.brand{font-family:var(--brand-font);font-weight:900;font-size:1.45rem;line-height:1;letter-spacing:-.01em;padding:0 .35rem 0 .15rem;white-space:nowrap;flex:0 0 auto;user-select:none}
.brand .c1,.wordmark .c1{color:var(--koi-pink)} .brand .c2,.wordmark .c2{color:var(--lily-green)} .brand .c3,.wordmark .c3{color:var(--pond-blue)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + .4rem);background:var(--chrome);border:1px solid var(--line);border-radius:.75rem;padding:.4rem;min-width:15rem;box-shadow:0 12px 32px rgba(10,20,30,.18);display:none;z-index:60}
.menu.open{display:block}
.menu button.item{display:flex;width:100%;align-items:center;gap:.6rem;border:0;background:none;padding:.55rem .6rem;border-radius:.5rem;text-align:left}
.menu button.item:hover{background:var(--chrome-2)}
.swatch{width:1rem;height:1rem;border-radius:.25rem;border:1px solid rgba(0,0,0,.2);flex:0 0 auto}
.menu h3{margin:.5rem .6rem .3rem;font-size:.85rem;color:var(--muted);font-weight:400}
.menu label{display:block;padding:.3rem .6rem;font-size:.85rem;color:var(--muted)}
.menu input[type=text]{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--chrome-2);color:var(--ink)}
.bg-row{display:flex;gap:.4rem;padding:.3rem .6rem .5rem}
.bg-row button{width:2.4rem;height:1.8rem;border-radius:.4rem;border:2px solid var(--line)}
.bg-row button[aria-pressed="true"]{border-color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:.4rem 0}
.menu .danger{color:var(--danger)}
.sync{padding:.3rem .6rem .5rem;font-size:.8rem;color:var(--muted)}

/* ---------- board ---------- */
.board{position:relative;flex:1 1 auto;overflow:hidden;--u:12px}
.board.bg-slate{background-color:#1E2A35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px}
.board.bg-white{background-color:#F1F3F4;background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1px);background-size:28px 28px}
.board.bg-cork{background-color:#BF956A;background-image:radial-gradient(rgba(90,50,20,.25) 1px,transparent 1.5px),radial-gradient(rgba(255,235,200,.25) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.board.bg-green{background-color:#23392F;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.board.bg-pond{background-color:#173A55;background-image:radial-gradient(ellipse 70% 60% at 50% 45%,#1F5470 0%,#173A55 55%,#0F2033 100%)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75);text-align:center;padding:2rem;font-size:1.1rem}
.bg-white .empty,.bg-cork .empty{color:rgba(0,0,0,.6)}

/* ---------- note ---------- */
.note{position:absolute;display:flex;flex-direction:column;background:var(--paper);color:var(--ink-note);border-radius:3px 3px 10px 3px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px -8px rgba(0,0,0,.35);min-width:140px;min-height:70px;--s:1}
.note.is-min{height:auto !important;min-height:0}
.note.dragging{box-shadow:0 2px 4px rgba(0,0,0,.2),0 22px 40px -10px rgba(0,0,0,.45)}
.note-head{display:flex;align-items:center;gap:.35em;padding:.5em .55em .35em .7em;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-bottom:1px dashed rgba(0,0,0,.15);font-size:max(13px,calc(var(--u) * 1.2 * var(--s)))}
.is-min .note-head{border-bottom:0;padding-bottom:.5em}
.dragging .note-head{cursor:grabbing}
.grip{width:.8em;height:1.2em;flex:0 0 auto;opacity:.45}
.note-title{margin:0;font-size:1em;font-weight:700;line-height:1.2;flex:0 1 auto;min-width:1ch;outline:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.note-title[contenteditable]:not([contenteditable="false"]){cursor:text;white-space:normal;border-radius:3px}
.note-title[contenteditable]:not([contenteditable="false"]):focus{background:rgba(255,255,255,.55)}
.preview{display:none;font-weight:400;opacity:.75;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.is-min .preview{display:block}
.spacer{flex:1 1 auto;min-width:.5em;align-self:stretch}
.is-min .spacer{flex:0 0 .25em}
.tools{display:flex;gap:.1em;flex:0 0 auto}
.tool{border:0;background:transparent;width:1.9em;height:1.9em;display:grid;place-items:center;border-radius:.35em;color:inherit;opacity:.65;padding:0}
.tool:hover{opacity:1;background:rgba(0,0,0,.08)}
.tool svg{width:1.05em;height:1.05em}
.dot{width:.95em;height:.95em;border-radius:50%;border:2px solid rgba(0,0,0,.35);background:conic-gradient(#FFE66B 0 25%,#A6E8C6 0 50%,#A9D8F7 0 75%,#FFB8CB 0)}
.note-body{flex:1 1 auto;overflow:auto;padding:.45em .8em .8em;font-size:max(15px,calc(var(--u) * 2.05 * var(--s)));line-height:1.3}
.is-min .note-body{display:none}
.note-text{outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.3em}
.note-text:empty::before{content:attr(data-ph);opacity:.4}
.list{list-style:none;margin:0;padding:0;counter-reset:n}
.list li{display:flex;gap:.45em;align-items:flex-start;padding:.12em 0;counter-increment:n}
.check{flex:0 0 auto;width:1em;height:1em;margin-top:.15em;border:2px solid rgba(0,0,0,.55);border-radius:.2em;background:transparent;padding:0;display:grid;place-items:center}
.check svg{width:.75em;height:.75em;opacity:0}
.done .check svg{opacity:1}
.list .num::before{content:counter(n) ".";font-weight:700;opacity:.55;min-width:1.2em;display:inline-block}
.item-text{outline:none;flex:1 1 auto;white-space:pre-wrap;word-break:break-word;min-width:2ch}
.item-text:empty::before{content:"New item";opacity:.4}
.done .item-text{text-decoration:line-through;text-decoration-thickness:.08em;opacity:.5}
.resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.22) 50%);border-bottom-right-radius:10px}
.is-min .resize{display:none}
.show-tools .tools .t-edit{display:grid}
.tools .t-edit{display:none}
.note:hover .tools .t-edit,.note:focus-within .tools .t-edit{display:grid}

/* ---------- present mode ---------- */
body.present .edit-only{display:none !important}
body.present .present-title{display:block}
body.present .brand{display:none}
body.present .tabs{display:none}
body.present .date{font-size:1.2rem;color:var(--ink);margin-left:auto}
body.present .tools .t-edit{display:none !important}
body.present .resize{display:none}
body.present .note-title,body.present .note-text,body.present .item-text{cursor:inherit}
.exit-present{display:none}
body.present .exit-present{display:inline-flex}

/* ---------- undo / redo buttons ---------- */
.btn.icon{padding:.45rem .55rem}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--chrome)}

/* ---------- trash ---------- */
.trash-wrap{position:fixed;inset:0;z-index:150;background:rgba(10,20,30,.45);display:grid;place-items:center;padding:1rem}
.trash-wrap[hidden]{display:none}
.trash-panel{width:100%;max-width:34rem;max-height:min(82vh,42rem);overflow:auto;background:var(--chrome);color:var(--ink);border:1px solid var(--line);border-radius:.9rem;padding:1rem 1.1rem;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.trash-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.trash-head h2{margin:0;font-size:1.3rem}
.trash-sub{color:var(--muted);font-size:.9rem;margin:.4rem 0 .6rem}
.trash-item{display:flex;gap:.7rem;align-items:flex-start;padding:.75rem 0;border-top:1px solid var(--line)}
.trash-item .swatch{margin-top:.2rem}
.trash-info{flex:1 1 auto;min-width:0}
.trash-info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-info .pv{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trash-info .meta{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.trash-acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.trash-empty{color:var(--muted);padding:1.2rem 0;text-align:center;border-top:1px solid var(--line);margin:0}
.trash-foot{border-top:1px solid var(--line);padding-top:.8rem;display:flex;justify-content:flex-end}
.btn.danger-btn{color:var(--danger)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:.7rem 1rem;border-radius:.6rem;display:none;gap:1rem;align-items:center;z-index:100;max-width:calc(100% - 2rem);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* ---------- phone: stacked bars ---------- */
@media (max-width:700px){
  .date{display:none}
  .brand{display:none}
  .btn .lbl{display:none}
  .board{overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.6rem}
  .note{position:relative !important;left:auto !important;top:auto !important;width:auto !important;height:auto !important;min-height:0;z-index:auto !important;flex:0 0 auto}
  .note-body{max-height:none}
  .note-head{cursor:pointer;touch-action:auto}
  .resize,.grip{display:none}
  .tools .t-edit{display:none !important}
  .empty{position:static}
}
@media (prefers-reduced-motion:no-preference){
  .note.dragging{transition:box-shadow .15s}
}

/* ---------- sign-in screen ---------- */
/* koi pond scene: pure decoration, never catches clicks */
.auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:1.25rem;background-color:#12263A;background-image:radial-gradient(ellipse 70% 60% at 50% 48%,#1F5470 0%,#173A55 55%,#0F2033 100%);overflow:auto}
.auth[hidden]{display:none}
.pond{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.pond svg.ripples{position:absolute;inset:0;width:100%;height:100%}
.pond img{position:absolute;height:auto;user-select:none;-webkit-user-drag:none}
.pond .koi{filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.pond .deep{opacity:.38;filter:blur(1.5px)}
.pond .pad,.pond .lotus{filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.pond .k1{left:11.8%;top:33%;width:clamp(120px,14.5vw,240px);--r:25deg}
.pond .k2{left:77%;top:38%;width:clamp(100px,11.8vw,195px);--r:-150deg}
.pond .d1{left:68%;top:70%;width:clamp(70px,8.3vw,140px);--r:95deg}
.pond .d2{left:24%;top:76%;width:clamp(64px,7.6vw,125px);--r:-120deg}
.pond .p2{left:3.5%;top:11%;width:clamp(130px,16.7vw,260px);transform:rotate(160deg)}
.pond .l2{left:8.2%;top:9.6%;width:clamp(70px,8.6vw,135px)}
.pond .p3{left:80%;top:15%;width:clamp(140px,18vw,280px);transform:rotate(20deg)}
.pond .l3{left:83%;top:11.8%;width:clamp(95px,12.2vw,190px)}
.pond .p4{left:82%;top:79%;width:clamp(120px,14.6vw,225px);transform:rotate(-40deg) scaleX(-1)}
.pond .koi,.pond .deep{transform:rotate(var(--r))}
@media (prefers-reduced-motion:no-preference){
  .pond .koi,.pond .deep{animation:swim 7s ease-in-out infinite alternate}
  .pond .k2{animation-duration:9s;animation-delay:-3s}
  .pond .d1{animation-duration:11s}
  .pond .d2{animation-duration:10s;animation-delay:-5s}
  @keyframes swim{from{transform:rotate(var(--r)) translateY(0)}to{transform:rotate(calc(var(--r) + 4deg)) translateY(-14px)}}
}
.auth-brand{position:fixed;left:clamp(1rem,3.3vw,3rem);top:clamp(.9rem,3.6vh,2.25rem);z-index:1;font-family:var(--brand-font);font-weight:900;font-size:clamp(1.8rem,2.8vw,2.5rem);line-height:1;letter-spacing:-.01em}
.auth-stage{position:relative;z-index:1;width:100%;max-width:25rem;margin:2.5rem 0}
.auth-stage .peek{position:absolute;right:-6.5rem;top:-7rem;width:9rem;height:auto;transform:rotate(60deg);filter:drop-shadow(0 12px 16px rgba(0,0,0,.35));pointer-events:none;z-index:0}
.auth-stage .under-pad{position:absolute;left:-6rem;bottom:-4.5rem;width:15rem;height:auto;transform:rotate(-15deg) scaleX(-1);filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));pointer-events:none;z-index:0}
.auth-card{position:relative;z-index:1;width:100%;background:#FFE66B;color:#1D1A14;padding:1.7rem 1.6rem 1.4rem;border-radius:3px 3px 22px 3px;box-shadow:0 2px 4px rgba(0,0,0,.2),0 30px 50px -10px rgba(0,0,0,.5);transform:rotate(-1.5deg)}
.auth-card h1{margin:0;font-family:var(--brand-font);font-weight:900;font-size:2.6rem;line-height:1;letter-spacing:-.01em}
.auth-sub{margin:.5rem 0 1.1rem;line-height:1.35}
.auth-card label{display:block;font-weight:700;margin:.7rem 0 0}
.auth-card input{display:block;width:100%;margin-top:.3rem;font:inherit;font-weight:400;padding:.65rem .7rem;border:2px solid #2F3040;border-radius:.6rem;background:#FFFDF2;color:#1D1A14}
.auth-card input:focus{outline:3px solid #C63F77;outline-offset:1px}
.auth-msg{min-height:1.3em;margin:.7rem 0 .4rem;font-size:.95rem}
.auth-msg.err{color:#9A1B10;font-weight:700}
.auth-card .wide{width:100%;justify-content:center;padding:.75rem;background:#C63F77;border-color:#C63F77;color:#fff;font-weight:700;border-radius:.7rem}
.auth-card .wide:hover{background:#B0346A}
@media (max-width:700px){
  .pond .k2,.pond .d1,.pond .d2,.pond .p3,.pond .l3,.pond .p4{display:none}
  .pond .k1{left:auto;right:-8%;top:auto;bottom:4%;width:110px}
  .pond .p2{left:-12%;top:3%;width:150px}
  .pond .l2{left:-2%;top:1%;width:80px}
  .auth-brand{display:none}
  .auth-stage .peek{width:6rem;right:-2.5rem;top:-4.5rem}
  .auth-stage .under-pad{width:9rem;left:-2.5rem;bottom:-3rem}
}
.auth-links{display:flex;justify-content:space-between;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
.auth-links button,.auth-skip{border:0;background:none;padding:.2rem 0;text-decoration:underline;color:#1D1A14}
.auth-skip{display:block;margin-top:.35rem;font-size:.9rem;opacity:.75}
.auth-note{margin:1rem 0 0;font-size:.9rem;font-weight:700}
.acct{padding:.2rem .6rem .5rem;font-size:.85rem;color:var(--muted);word-break:break-all}

/* ---------- floating window (picture-in-picture) ---------- */
.pip{padding:.6rem;display:flex;flex-direction:column;gap:.5rem;height:100%;overflow:auto;background:#1E2A35}
.pip-top{color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.1rem .2rem}
.pip-top b{font-size:1.05rem}
.pip-top span{font-size:.85rem;opacity:.75}
.pip .note{position:relative;--u:8px;flex:0 0 auto}
.pip .note-head{cursor:grab;touch-action:none}
.pip .resize,.pip .t-edit{display:none !important}
.pip .grip{display:block;opacity:.55}
.pip-undo{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:.4rem;padding:.15rem .55rem;font:inherit;font-size:.8rem;cursor:pointer;margin-left:auto}
.pip-undo:disabled{opacity:.35;cursor:default}
.pip .note.pip-lifted{z-index:2;transform:scale(1.03);outline:3px solid #7FA4FF;outline-offset:2px;box-shadow:0 4px 8px rgba(0,0,0,.25),0 22px 40px -10px rgba(0,0,0,.6)}
.pip .note.pip-lifted .note-head{cursor:grabbing}
body.pip-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<header class="bar" id="bar">
  <span class="brand" aria-label="Floatle"><span class="c1">F</span><span class="c2">l</span><span class="c3">o</span><span class="c1">a</span><span class="c2">t</span><span class="c3">l</span><span class="c1">e</span></span>
  <div class="present-title" id="presentTitle"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Classes"></nav>
  <span class="date" id="date"></span>
  <div class="menu-wrap edit-only">
    <button class="btn primary" id="addBtn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add note</span>
    </button>
    <div class="menu" id="addMenu" role="menu"></div>
  </div>
  <button class="btn icon edit-only" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button class="btn icon edit-only" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>

boardEl.addEventListener("click", e => {

function handleNoteAction(n, e, noteNode, inPip){
  const btn = e.target.closest("[data-act]");
  // on phones and in the floating window, tapping a bar opens it
  if (!btn && (narrow() || inPip) && e.target.closest(".note-head") && !e.target.isContentEditable){
    n.min = !n.min; after(); return;
  }
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "min"){ n.min = !n.min; }
  else if (act === "color"){ n.color = COLOR_KEYS[(COLOR_KEYS.indexOf(n.color)+1) % COLOR_KEYS.length]; }
  else if (act === "smaller"){ n.s = Math.max(0.5, +( (n.s||1) - 0.15).toFixed(2)); }
  else if (act === "bigger"){ n.s = Math.min(3, +((n.s||1) + 0.15).toFixed(2)); }
  else if (act === "check"){
    const li = btn.closest("[data-item]"); const it = n.items.find(i => i.id === li.dataset.item);
    if (it) it.done = !it.done;
  }
  else if (act === "delete"){
    const b = board(); const idx = b.notes.indexOf(n);
    b.notes.splice(idx,1);
    const t = trashItem("note", n, b, idx);
    noteNode.remove(); save();
    if (!b.notes.length) renderBoard();
    toast("Note moved to Trash.", () => restoreFromTrash(t.id));
    return;
  } else return;
  after();
  function after(){
    save();
    if (inPip) { const bn = boardEl.querySelector(`.note[data-id="${n.id}"]`); if (bn) renderNote(n); }
    else renderNote(n);
  }
}

/* drag + resize with pointer events (mouse, pen and touch) */
let drag = null;
boardEl.addEventListener("pointerdown", e => {
  if (narrow()) return;
  const noteNode = e.target.closest(".note"); if (!noteNode) return;
  const n = findNote(noteNode.dataset.id); if (!n) return;
  if (n.z !== zTop){ n.z = ++zTop; noteNode.style.zIndex = n.z; }
  const isResize = e.target.closest("[data-act=resize]");
  const inHead = e.target.closest(".note-head");
  if (!isResize && !inHead) return;
  if (!isResize && (e.target.closest("button") || (e.target.isContentEditable))) return;
  e.preventDefault();
  const r = boardEl.getBoundingClientRect();
  drag = { n, el:noteNode, mode:isResize?"resize":"move", sx:e.clientX, sy:e.clientY,
    x:n.x, y:n.y, w:n.w, h:n.h, W:r.width, H:r.height, pid:e.pointerId, moved:false,
    elH: noteNode.offsetHeight };
  noteNode.setPointerCapture(e.pointerId);
  noteNode.classList.add("dragging");
});
boardEl.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = (e.clientX - drag.sx) / drag.W * 100, dy = (e.clientY - drag.sy) / drag.H * 100;
  if (Math.abs(dx)+Math.abs(dy) > 0.2) drag.moved = true;
  const n = drag.n;
  if (drag.mode === "move"){
    const hPct = drag.elH / drag.H * 100;
    n.x = clamp(drag.x + dx, -n.w + 8, 100 - 4);
    n.y = clamp(drag.y + dy, 0, 100 - Math.min(hPct, 8));
    drag.el.style.left = n.x + "%"; drag.el.style.top = n.y + "%";
  } else {
    n.w = clamp(drag.w + dx, 140 / drag.W * 100, 100 - n.x);
    n.h = clamp(drag.h + dy, 70 / drag.H * 100, 100 - n.y);
    drag.el.style.width = n.w + "%"; drag.el.style.height = n.h + "%";
  }
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  drag.el.classList.remove("dragging");
  if (drag.moved) save();
  else if (drag.n.z) save();
  drag = null;
}
boardEl.addEventListener("pointerup", endDrag);
boardEl.addEventListener("pointercancel", endDrag);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

/* ---------- trash (30-day restore) ---------- */
function trashItem(type, item, b, index){
  const t = { id:uid(), type, deletedAt:Date.now(), boardId: b ? b.id : null, boardName: b ? b.name : "", index, item };
  state.trash.push(t);
  if (state.trash.length > 200) state.trash.splice(0, state.trash.length - 200);
  return t;
}
function restoreFromTrash(tid){
  const i = state.trash.findIndex(t => t.id === tid); if (i < 0) return;
  const t = state.trash[i];
  let where = "";
  if (t.type === "note"){
    const b = state.boards.find(x => x.id === t.boardId) || board();
    if (!b.notes.some(n => n.id === t.item.id)){
      t.item.z = ++zTop;
      b.notes.splice(Math.min(t.index ?? b.notes.length, b.notes.length), 0, t.item);
    }
    state.active = b.id; where = " to " + b.name;
  } else {
    if (!state.boards.some(x => x.id === t.item.id)) state.boards.splice(Math.min(t.index ?? state.boards.length, state.boards.length), 0, t.item);
    state.active = t.item.id;
  }
  state.trash.splice(i, 1);
  render(); save();
  if (!$("trashWrap").hidden) renderTrash();
  toast((t.type === "note" ? "Note restored" : "Class restored") + where + ".");
}
function relDays(ms){
  const d = Math.floor((Date.now() - ms) / DAY_MS);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago";
}
function renderTrash(){
  purgeTrash();
  const list = $("trashList");
  const items = state.trash.slice().sort((a, b) => b.deletedAt - a.deletedAt);
  if (!items.length){ list.innerHTML = '<p class="trash-empty">Trash is empty.</p>'; return; }
  list.innerHTML = items.map(t => {
    const left = Math.max(1, TRASH_DAYS - Math.floor((Date.now() - t.deletedAt) / DAY_MS));
    const meta = `Deleted ${relDays(t.deletedAt)} &bull; removed for good in ${left} day${left > 1 ? "s" : ""}`;
    const acts = `<div class="trash-acts"><button class="btn" data-tact="restore">Restore</button><button class="btn danger-btn" data-tact="forever">Delete forever</button></div>`;
    if (t.type === "board"){
      const c = (t.item.notes || []).length;
      return `<div class="trash-item" data-tid="${t.id}"><span class="swatch" style="background:${BG_SWATCH[t.item.bg] || BG_SWATCH.slate}"></span>
        <div class="trash-info"><b>${esc(t.item.name)} (whole class)</b><div class="pv">${c} note${c === 1 ? "" : "s"}</div><div class="meta">${meta}</div></div>${acts}</div>`;
    }
    const n = t.item;
    return `<div class="trash-item" data-tid="${t.id}"><span class="swatch" style="background:${COLORS[n.color] || COLORS.lemon}"></span>
      <div class="trash-info"><b>${esc(n.title || "Note")}</b><div class="pv">${esc(firstLine(n)) || "&nbsp;"}</div><div class="meta">From ${esc(t.boardName || "a class")} &bull; ${meta}</div></div>${acts}</div>`;
  }).join("") + `<div class="trash-foot"><button class="btn danger-btn" id="emptyTrash">Empty trash</button></div>`;
}
function openTrash(){ renderTrash(); $("trashWrap").hidden = false; setTimeout(() => $("trashClose").focus(), 30); }
function closeTrash(){ $("trashWrap").hidden = true; renderSettings(); }
$("trashClose").addEventListener("click", closeTrash);
$("trashWrap").addEventListener("click", e => {
  if (e.target === $("trashWrap")){ closeTrash(); return; }
  // "Delete forever" and "Empty trash" ask for a second tap
  const arm = (btn, label, fn) => {
    if (btn.dataset.armed){ fn(); return; }
    btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3000);
  };
  if (e.target.id === "emptyTrash"){
    arm(e.target, "Tap again to empty", () => { state.trash = []; save(); renderTrash(); toast("Trash emptied.", undo); });
    return;
  }
  const btn = e.target.closest("[data-tact]"); if (!btn) return;
  const tid = btn.closest("[data-tid]").dataset.tid;
  if (btn.dataset.tact === "restore") restoreFromTrash(tid);
  else arm(btn, "Tap again", () => { state.trash = state.trash.filter(t => t.id !== tid); save(); renderTrash(); });
});

/* ---------- undo keyboard shortcuts (main page and floating window) ---------- */
function onUndoKey(e){
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = (e.key || "").toLowerCase();
  if (k !== "z" && k !== "y") return;
  if (!$("auth").hidden || !$("trashWrap").hidden) return;
  if (e.target && e.target.closest && e.target.closest("input")) return;   // text boxes (class name) keep their own undo
  if (presenting) return;
  e.preventDefault();
  if (k === "y" || e.shiftKey) redo(); else undo();
}
document.addEventListener("keydown", onUndoKey);
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);

/* ---------- floating always-on-top window (Chrome / Edge on a computer) ---------- */
let pipWin = null;
let pipDrag = null;          // reorder drag in progress inside the floating window
let pipRenderPending = false;
let pipSuppressClick = false;
$("pipBtn").addEventListener("click", async () => {
  if (pipWin && !pipWin.closed){ pipWin.focus?.(); return; }
  if (!("documentPictureInPicture" in window)){
    toast("The floating window needs Chrome or Edge on a computer. On iPad, use Split View beside your slides.");
    return;
  }
  try {
    pipWin = await window.documentPictureInPicture.requestWindow({ width:380, height:520 });
  } catch(e){
    toast("Your browser blocked the floating window here. Open this page in its own tab and try Float again.");
    return;
  }
  const d = pipWin.document;
  const link = d.createElement("link"); link.rel = "stylesheet"; link.href = $("font-link").href; d.head.appendChild(link);
  const st = d.createElement("style"); st.textContent = $("app-css").textContent; d.head.appendChild(st);
  d.title = "Floatle";
  d.body.innerHTML = '<div class="pip" id="pip"></div>';
  d.addEventListener("keydown", onUndoKey);
  d.body.addEventListener("click", e => {
    if (pipSuppressClick){ pipSuppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    if (e.target.closest("[data-pact=undo]")){ undo(); return; }
    const noteNode = e.target.closest(".note"); if (!noteNode) return;
    const n = findNote(noteNode.dataset.id); if (!n) return;
    handleNoteAction(n, e, noteNode, true);
  });
  // Drag a note's bar up or down to reorder the stack
  d.body.addEventListener("pointerdown", pipPointerDown);
  d.body.addEventListener("pointermove", pipPointerMove);
  d.body.addEventListener("pointerup", pipPointerUp);
  d.body.addEventListener("pointercancel", pipPointerUp);
  pipWin.addEventListener("pagehide", () => { pipWin = null; pipDrag = null; pipRenderPending = false; });
  renderPip();
});

// Order of notes in the floating window. Uses the order the teacher dragged;
// notes that were never dragged fall back to their position on the board (top to bottom).
function pipSortedNotes(b){
  const order = Array.isArray(b.pipOrder) ? b.pipOrder : [];
  const rank = id => { const i = order.indexOf(id); return i === -1 ? Infinity : i; };
  return b.notes.slice().sort((a,c) => (rank(a.id) - rank(c.id)) || (a.y - c.y) || (a.x - c.x));
}

function renderPip(){
  if (!pipWin || pipWin.closed) return;
  if (pipDrag){ pipRenderPending = true; return; }   // don't redraw mid-drag
  const root = pipWin.document.getElementById("pip"); if (!root) return;
  const scroll = root.scrollTop;
  const b = board();
  root.innerHTML = `<div class="pip-top"><b></b><span></span><button class="pip-undo" data-pact="undo" title="Undo (Ctrl+Z)" ${undoStack.length ? "" : "disabled"}>&#8630; Undo</button></div>`;
  root.querySelector("b").textContent = b.name;
  root.querySelector("span").textContent = $("date").textContent;
  pipSortedNotes(b).forEach(n => {
    const el = noteEl(n, true);
    el.style.cssText = `--paper:${COLORS[n.color]};--s:1`;
    el.querySelector(".note-head").title = "Drag to reorder. Click to minimize or expand.";
    root.appendChild(el);
  });
  root.scrollTop = scroll;
}

function pipPointerDown(e){
  if (e.button > 0) return;
  const head = e.target.closest(".note-head"); if (!head) return;
  if (e.target.closest("button")) return;           // let the minimize button work normally
  e.preventDefault();
  pipDrag = { el: head.closest(".note"), head, pid: e.pointerId, sx: e.clientX, sy: e.clientY, active: false };
  try { head.setPointerCapture(e.pointerId); } catch(err){}
}
function pipPointerMove(e){
  if (!pipDrag || e.pointerId !== pipDrag.pid) return;
  if (!pipDrag.active){
    // small movements still count as a click (minimize / expand)
    if (Math.abs(e.clientX - pipDrag.sx) + Math.abs(e.clientY - pipDrag.sy) < 6) return;
    pipDrag.active = true;
    pipDrag.el.classList.add("pip-lifted");
    pipWin.document.body.classList.add("pip-dragging");
  }
  e.preventDefault();
  const root = pipDrag.el.parentElement;
  const others = [...root.querySelectorAll(".note")].filter(n => n !== pipDrag.el);
  let before = null;
  for (const o of others){
    const r = o.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2){ before = o; break; }
  }
  if (before){ if (pipDrag.el.nextElementSibling !== before) root.insertBefore(pipDrag.el, before); }
  else if (root.lastElementChild !== pipDrag.el) root.appendChild(pipDrag.el);
  // scroll the window when dragging near the top or bottom edge
  const R = root.getBoundingClientRect();
  if (e.clientY < R.top + 40) root.scrollTop -= 12;
  else if (e.clientY > R.bottom - 40) root.scrollTop += 12;
}
function pipPointerUp(e){
  if (!pipDrag || e.pointerId !== pipDrag.pid) return;
  const d = pipDrag;
  pipDrag = null;
  if (!d.active){                     // it was a click, not a drag
    if (pipRenderPending){ pipRenderPending = false; renderPip(); }
    return;
  }
  d.el.classList.remove("pip-lifted");
  pipWin.document.body.classList.remove("pip-dragging");
  pipSuppressClick = true;            // swallow the click that follows the drag
  setTimeout(() => { pipSuppressClick = false; }, 80);
  const root = d.el.parentElement;
  const b = board();
  b.pipOrder = [...root.querySelectorAll(".note")].map(el => el.dataset.id);
  pipRenderPending = false;
  save();                             // saves to this device + account, then redraws
}

if (sb){
  $("authSwitch").addEventListener("click", () => showAuth(authMode === "signin" ? "signup" : "signin"));
  $("authForgot").addEventListener("click", () => showAuth("forgot"));
  $("authSkip").addEventListener("click", () => { try { localStorage.setItem("swbats.skipLogin","1"); } catch(e){} hideAuth(); });
  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("authEmail").value.trim(), pw = $("authPw").value;
    const btn = $("authSubmit");
    if (authMode !== "reset" && !/^\S+@\S+\.\S+$/.test(email)) return authMsg("Enter a valid email address.", true);
    if ((authMode === "signin" || authMode === "signup" || authMode === "reset") && pw.length < 6) return authMsg("Passwords need at least 6 characters.", true);
    btn.disabled = true; authMsg("One moment…");
    try {
      if (authMode === "signin"){
        const { error } = await sb.auth.signInWithPassword({ email, password:pw });
        if (error) authMsg(/confirm/i.test(error.message) ? "Confirm your email first. Check your inbox for the link." : "That email and password don't match. Try again or reset your password.", true);
        else { try { localStorage.removeItem("swbats.skipLogin"); } catch(e){} $("authPw").value = ""; }
      } else if (authMode === "signup"){
        const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ emailRedirectTo: redirectURL } });
        if (error) authMsg(error.message, true);
        else if (!data.session){ showAuth("signin"); $("authEmail").value = email; authMsg("Account created. Check your email for a confirmation link, then sign in here."); }
      } else if (authMode === "forgot"){
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectURL });
        if (error) authMsg(error.message, true); else authMsg("If that email has an account, a reset link is on its way.");
      } else if (authMode === "reset"){
        const { error } = await sb.auth.updateUser({ password:pw });
        if (error) authMsg(error.message, true);
        else { hideAuth(); history.replaceState(null, "", redirectURL); toast("Password updated."); }
      }
    } catch(err){ authMsg("Can't reach the server. Check your internet connection and try again.", true); }
    btn.disabled = false;
  });
}

$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const next = JSON.parse(await f.text());
    if (!next || !Array.isArray(next.boards) || !next.boards.length) throw 0;
    setState(next);
    render(); save(); toast("Imported " + state.boards.length + " class" + (state.boards.length>1?"es":"") + ".");
  } catch(err){ toast("That file isn't a Floatle backup. Choose a file made with Export."); }
});

render();
resetHistory();
})();
</script>
